[project]
name = "netpulse"
version = "0.1.0"
description = "Terminal dashboard for local network presence monitoring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7.0",
]

[project.scripts]
netpulse = "netpulse.cli:main"
netpulse-rename = "netpulse.rename:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
